[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "margins-maps"
version = "0.1.0"
description = "Certified spatial reaggregation over overlapping supports"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "matplotlib==3.10.7",
  "numpy==2.3.4",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "pyproj==3.7.2",
  "scipy==1.16.3",
  "shapely==2.1.2",
]

[project.optional-dependencies]
dev = ["black==24.10.0", "flake8==7.1.1", "pytest==8.4.2"]

[project.scripts]
margins-maps = "margins_maps.workflow:main"
margins-maps-check = "margins_maps.inputs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
